spring:
  application:
    name: sneakstock
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/sneakstock}
    username: ${DB_USERNAME:sneakstock}
    password: ${DB_PASSWORD:sneakstock}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  # Las plataformas de despliegue indican el puerto con la variable PORT; en local, 8080
  port: ${PORT:8080}
