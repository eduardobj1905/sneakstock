# Integración continua: en cada pull request y en cada cambio en main se comprueban el backend y el frontend.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Java 21 + tests con Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Los tests de integración arrancan su propio MySQL con Testcontainers (Docker ya está en el runner)
      - name: Compilar y ejecutar los tests
        run: ./mvnw -B verify

  frontend:
    name: Frontend (tipos, lint, formato, tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Comprobar tipos
        run: npm run type-check
      - name: Lint
        run: npx oxlint . && npx eslint .
      - name: Formato
        run: npx prettier --check src
      - name: Tests
        run: npm run test:unit -- --run
      - name: Build
        run: npm run build-only
